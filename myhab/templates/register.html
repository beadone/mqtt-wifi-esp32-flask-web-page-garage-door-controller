
{% extends "base.html" %}

{% block content %}
    <h1>Register</h1>
<p>Register page</p>
<form method="POST" action="">
    {{ form.hidden_tag() }}
    {{ form.username }}
    {{ form.password }}
    {{ form.submit }}
</form>

<a  aria-current="page" href="{{ url_for('login') }}">Login if you already have an account</a>
{% endblock %}
